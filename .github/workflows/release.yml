name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v0.0.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Approved SemVer tag to release, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          if [[ "$tag" == "v0.0.0" ]]; then
            echo "v0.0.0 is the initial version baseline and is not a publishable release."
            exit 1
          fi
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$tag" origin/master
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test, and package Windows artifacts
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=C:/msys64/mingw64/bin/g++.exe \
            -DCMAKE_MAKE_PROGRAM=C:/msys64/mingw64/bin/ninja.exe \
            -DETOOLKIT_BUILD_TESTS=ON \
            -DETOOLKIT_BUILD_APPLICATIONS=ON \
            -DETOOLKIT_BUILD_SHARED_LIBRARY=ON \
            -DETOOLKIT_BUILD_STATIC_LIBRARY=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --target all

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Verify version source
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (Get-Content VERSION -Raw).Trim()
          if ($actual -ne $env:EXPECTED_VERSION) {
            throw "VERSION ($actual) does not match the release tag ($env:EXPECTED_VERSION)."
          }

      - name: Assemble package
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "package/etoolkit-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path "$root/bin", "$root/lib", "$root/include", "$root/test", "$root/applications" | Out-Null
          Copy-Item "build/libEToolkit_shared.dll" "$root/bin/"
          Copy-Item "build/libEToolkit_static.a" "$root/lib/"
          Copy-Item "build/libEToolkit_shared.dll.a" "$root/lib/"
          Copy-Item "build/test/etoolkit_tests.exe" "$root/test/"
          Copy-Item "build/test/libEToolkit_shared.dll" "$root/test/"
          Copy-Item "build/applications/simple_window/EToolkitSimpleWindow.exe" "$root/applications/"
          Copy-Item "build/applications/simple_window/libEToolkit_shared.dll" "$root/applications/" -ErrorAction SilentlyContinue
          Copy-Item "include/*" "$root/include/" -Recurse
          Copy-Item README.md, LICENSE, CHANGELOG.md "$root/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$root/*" -DestinationPath "etoolkit-$env:VERSION-windows-x64.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: etoolkit-${{ needs.validate-tag.outputs.version }}-windows-x64
          path: etoolkit-${{ needs.validate-tag.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: etoolkit-${{ needs.validate-tag.outputs.version }}-windows-x64

      - name: Generate checksum
        run: sha256sum "etoolkit-${{ needs.validate-tag.outputs.version }}-windows-x64.zip" > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-tag.outputs.tag }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          gh release create "$TAG" \
            "etoolkit-$VERSION-windows-x64.zip" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "EToolkit $TAG" \
            --generate-notes
